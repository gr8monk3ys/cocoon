<!doctype html>
<html>
<head><meta charset="utf-8"><title>facebook fixture</title></head>
<body>
  <!-- Hand-written mirror of facebook.com's home page as observed live in
       July 2026. Both feed layouts are present: the legacy role="feed" and the
       current container that only its screen-reader heading identifies. -->
  <div role="navigation" aria-label="Shortcuts"><a href="/groups/1/">A group</a></div>
  <nav>
    <a href="/watch/">Watch</a>
    <a href="/reel/?s=tab">Reel</a>
  </nav>
  <div role="main">
    <div aria-label="Stories" role="region"><div>story cards</div></div>
    <!-- legacy feed layout (role=feed still in rollout on some accounts) -->
    <div role="feed">
      <div>
        <div role="article"><span>A post from a friend</span></div>
      </div>
    </div>
    <!-- current feed layout: container identified only by its
         screen-reader heading; marked by the observer, not CSS -->
    <div>
      <h3>Feed posts</h3>
      <div aria-hidden="true"></div>
      <div>
        <div><span>A post in the new layout</span></div>
        <div><span>People you may know</span></div>
      </div>
    </div>
  </div>
  <div role="complementary"><span>Sponsored</span></div>
</body>
</html>
