<!doctype html>
<html>
<head><meta charset="utf-8"><title>instagram fixture</title></head>
<body>
  <!-- Hand-written mirror of instagram.com's home page as observed live in
       July 2026. Structural attributes only: obfuscated class names are never
       part of a rule. -->
  <nav>
    <a href="/">Home</a>
    <a href="/reels/">Reels</a>
    <a href="/explore/">Explore</a>
    <a href="/direct/inbox/">Messages</a>
  </nav>
  <main>
    <!-- stories tray -->
    <div>
      <ul>
        <li><button><canvas width="66" height="66"></canvas></button></li>
        <li><button><canvas width="66" height="66"></canvas></button></li>
      </ul>
    </div>
    <!-- feed -->
    <div role="feed">
      <article>
        <img alt="Photo by someone" />
        <a href="/p/abc123/liked_by/">42 likes</a>
      </article>
    </div>
    <!-- suggested accounts sidebar -->
    <div>
      <div><span>Suggested for you</span> <a href="/explore/people/">See All</a></div>
    </div>
  </main>
</body>
</html>
