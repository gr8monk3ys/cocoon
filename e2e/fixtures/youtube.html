<!doctype html>
<html>
<head><meta charset="utf-8"><title>youtube fixture</title></head>
<body>
  <ytd-app>
    <ytd-page-manager id="page-manager">
      <ytd-browse page-subtype="home">
        <div id="contents">
          <ytd-rich-grid-renderer>
            <ytd-rich-item-renderer>A video</ytd-rich-item-renderer>
            <ytd-rich-section-renderer>
              <ytd-rich-shelf-renderer is-shorts>A Shorts shelf</ytd-rich-shelf-renderer>
            </ytd-rich-section-renderer>
          </ytd-rich-grid-renderer>
        </div>
      </ytd-browse>
      <ytd-reel-shelf-renderer>A Shorts shelf in search results</ytd-reel-shelf-renderer>
      <ytd-shorts hidden>The Shorts player, kept in the page manager after a visit</ytd-shorts>
    </ytd-page-manager>
  </ytd-app>
</body>
</html>
