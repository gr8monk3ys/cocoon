name: semgrep

on:
  push:
    branches:
      - "**"
  pull_request:

permissions: read-all

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Semgrep
        # Public rule packs run without a SEMGREP_APP_TOKEN, unlike `--config auto`.
        run: semgrep scan --config p/security-audit --config p/typescript --config p/secrets --error
