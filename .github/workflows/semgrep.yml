name: semgrep

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 17 * *"  # monthly (minute-safe policy)

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run Semgrep
        # Public rule packs run without a SEMGREP_APP_TOKEN, unlike `--config auto`.
        run: semgrep scan --config p/security-audit --config p/typescript --config p/secrets --error
