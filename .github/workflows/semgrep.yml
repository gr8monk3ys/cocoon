name: semgrep

on:
  push:
    branches:
      - "**"
  pull_request:

permissions: read-all

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Run Semgrep
        # Public rule packs run without a SEMGREP_APP_TOKEN, unlike `--config auto`.
        run: semgrep scan --config p/security-audit --config p/typescript --config p/secrets --error
