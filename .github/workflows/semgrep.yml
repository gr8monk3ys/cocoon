name: semgrep

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 17 * *"  # monthly (minute-safe policy)

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Semgrep
        # Public rule packs run without a SEMGREP_APP_TOKEN, unlike `--config auto`.
        run: semgrep scan --config p/security-audit --config p/typescript --config p/secrets --error
