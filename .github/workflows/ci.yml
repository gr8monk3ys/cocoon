permissions: read-all

name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Blocking gate covers what actually ships (production deps only), so a
      # new advisory in a dev-only transitive can't turn every push red.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=moderate

      # Full-tree audit stays visible in logs but never blocks; dev-dep
      # advisories are handled via Dependabot + the monthly security-baseline.
      - name: Audit (all deps, informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true
