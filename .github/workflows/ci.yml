permissions: read-all

name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Selector fixtures + the built extension loaded into a real Chromium.
      - name: E2E (fixtures + built extension)
        run: npm run e2e

      # Blocking gate covers what actually ships (production deps only), so a
      # new advisory in a dev-only transitive can't turn every push red.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=moderate

      # Full-tree audit stays visible in logs but never blocks; dev-dep
      # advisories are handled via Dependabot.
      - name: Audit (all deps, informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true
