permissions: read-all

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Blocking gate covers what actually ships (production deps only), so a
      # new advisory in a dev-only transitive can't turn every push red.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=moderate

      # Full-tree audit stays visible in logs but never blocks; dev-dep
      # advisories are handled via Dependabot + the monthly security-baseline.
      - name: Audit (all deps, informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true
